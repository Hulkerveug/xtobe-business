services:
  - type: web
    name: xtobe
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ADMIN_PASSWORD
        sync: false
      - key: LICENSE_SECRET
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_DOMAINS
        value: xtobe.ae,api.xtobe.ae,xtobe-business.onrender.com
      - key: SENTRY_DSN
        sync: false
      - key: RENDER_APP_URL
        sync: false

# Level 3: Auto-rollback via GitHub Action if /health fails
# Set secrets in GitHub: RENDER_APP_URL, SLACK_WEBHOOK
