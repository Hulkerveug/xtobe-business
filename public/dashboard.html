<!doctype html><html><head><meta charset="utf-8"><title>Dashboard</title></head><body><h1>Dashboard - PC Admin Model</h1><form id="login"><input name="email" value="admin@xtobe.ae"><input name="password" type="password"><button>Login</button></form><script>document.getElementById('login').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:fd.get('email'),password:fd.get('password')})});const j=await r.json();alert(JSON.stringify(j))}</script></body></html>
