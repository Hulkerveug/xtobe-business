<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XTOBE — AI Core</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#050507;--txt:#fff;--dim:rgba(255,255,255,.4);--purple:#7a5cff;--blue:#3E9EFF;--live:#34d399}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow:hidden}
.mono{font-family:'JetBrains Mono',monospace}
.back{position:fixed;top:20px;left:20px;color:var(--dim);text-decoration:none;font-size:13px;font-weight:600;padding:8px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.1);transition:.2s}
.back:hover{color:#fff;border-color:rgba(255,255,255,.3)}
h1{font-size:28px;font-weight:800;letter-spacing:-.03em;margin-bottom:8px}
.sub{font-size:13px;color:var(--dim);margin-bottom:40px}
#canvas-container{width:100%;max-width:600px;height:400px;position:relative}
canvas{width:100%;height:100%;border-radius:20px}
.controls{display:flex;gap:14px;margin-top:30px;flex-wrap:wrap;justify-content:center}
.btn{border:none;border-radius:99px;padding:14px 28px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:.2s;display:inline-flex;align-items:center;gap:8px}
.btn.activate{background:linear-gradient(135deg,var(--purple),var(--blue));color:#fff}
.btn.analyze{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.15)}
.btn.sync{background:rgba(52,211,153,.15);color:var(--live);border:1px solid rgba(52,211,153,.3)}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(122,92,255,.3)}
.status{margin-top:24px;font-size:11px;color:var(--dim);font-family:'JetBrains Mono',monospace;letter-spacing:.1em}
.status b{color:var(--live)}
</style>
</head>
<body>
<a href="index.html" class="back">← Back</a>
<h1>AI Core</h1>
<p class="sub">Holographic interface — local processing</p>
<div id="canvas-container">
  <canvas id="ai-canvas"></canvas>
</div>
<div class="controls">
  <button class="btn activate" onclick="activate()">⚡ ACTIVATE</button>
  <button class="btn analyze" onclick="analyze()">🔍 ANALYZE</button>
  <button class="btn sync" onclick="sync()">🔄 SYNC</button>
</div>
<div class="status">STATUS: <b id="status-text">STANDBY</b> · MODE: <b>LOCAL</b> · NODE: <b>BLIND</b></div>

<!-- Mobile Nav Bar -->
<div class="mobile-nav">
  <a href="index.html" class="nav-item">
    <span class="nav-icon">💬</span>
    <span class="nav-label">Chats</span>
  </a>
  <a href="#" class="nav-item">
    <span class="nav-icon">📞</span>
    <span class="nav-label">Calls</span>
  </a>
  <a href="ai-core.html" class="nav-item nav-center">
    <span class="nav-icon">⚡</span>
    <span class="nav-label">Core</span>
  </a>
  <a href="#" class="nav-item">
    <span class="nav-icon">◫</span>
    <span class="nav-label">Wallet</span>
  </a>
  <a href="#" class="nav-item">
    <span class="nav-icon">◍</span>
    <span class="nav-label">Me</span>
  </a>
</div>

<style>
.mobile-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 12px 0;
  background: rgba(5,5,7,.95);
  backdrop-filter: blur(20px);
  border-top: 1px solid rgba(255,255,255,.08);
  z-index: 100;
}
.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  text-decoration: none;
  color: rgba(255,255,255,.4);
  font-size: 10px;
  font-weight: 600;
  transition: .2s;
  flex: 1;
}
.nav-item:hover { color: #fff; }
.nav-icon { font-size: 20px; }
.nav-label { font-size: 9px; letter-spacing: .06em; }
.nav-center .nav-icon {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: linear-gradient(135deg, #7a5cff, #3E9EFF);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  margin-top: -20px;
  box-shadow: 0 8px 30px rgba(122,92,255,.4);
}
.nav-center .nav-label { margin-top: 4px; }
</style>

<script>
const canvas = document.getElementById('ai-canvas');
const ctx = canvas.getContext('2d');
let W, H, time = 0, active = false;

function resize() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * 2;
  canvas.height = rect.height * 2;
  ctx.scale(2, 2);
  W = rect.width;
  H = rect.height;
}
resize();
window.addEventListener('resize', resize);

function draw() {
  ctx.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2;
  const baseR = Math.min(W, H) * 0.25;

  // Outer ring
  ctx.beginPath();
  ctx.arc(cx, cy, baseR + 40, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(122,92,255,.15)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Middle ring
  ctx.beginPath();
  ctx.arc(cx, cy, baseR + 20, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(62,158,255,.2)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Inner ring
  ctx.beginPath();
  ctx.arc(cx, cy, baseR, 0, Math.PI * 2);
  ctx.strokeStyle = active ? 'rgba(52,211,153,.6)' : 'rgba(122,92,255,.4)';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Core sphere
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, baseR);
  grad.addColorStop(0, active ? 'rgba(52,211,153,.3)' : 'rgba(122,92,255,.2)');
  grad.addColorStop(0.7, active ? 'rgba(52,211,153,.1)' : 'rgba(122,92,255,.05)');
  grad.addColorStop(1, 'transparent');
  ctx.beginPath();
  ctx.arc(cx, cy, baseR, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();

  // Orbiting particles
  for (let i = 0; i < 12; i++) {
    const angle = (i / 12) * Math.PI * 2 + time * 0.5;
    const r = baseR + 30 + Math.sin(time + i) * 10;
    const x = cx + Math.cos(angle) * r;
    const y = cy + Math.sin(angle) * r;
    ctx.beginPath();
    ctx.arc(x, y, 2, 0, Math.PI * 2);
    ctx.fillStyle = active ? 'rgba(52,211,153,.8)' : 'rgba(122,92,255,.6)';
    ctx.fill();
  }

  // Center text
  ctx.fillStyle = active ? 'rgba(52,211,153,.9)' : 'rgba(255,255,255,.5)';
  ctx.font = '12px "JetBrains Mono", monospace';
  ctx.textAlign = 'center';
  ctx.fillText(active ? 'ACTIVE' : 'STANDBY', cx, cy + 4);

  time += 0.02;
  requestAnimationFrame(draw);
}
draw();

function activate() {
  active = !active;
  document.getElementById('status-text').textContent = active ? 'ACTIVE' : 'STANDBY';
}
function analyze() {
  document.getElementById('status-text').textContent = 'ANALYZING...';
  setTimeout(() => { document.getElementById('status-text').textContent = active ? 'ACTIVE' : 'STANDBY'; }, 1500);
}
function sync() {
  document.getElementById('status-text').textContent = 'SYNCING...';
  setTimeout(() => { document.getElementById('status-text').textContent = active ? 'ACTIVE' : 'STANDBY'; }, 2000);
}
</script>
</body>
</html>
