<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XTOBE — Chat</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#050507;--card:rgba(255,255,255,.04);--line:rgba(255,255,255,.08);--txt:#fff;--dim:rgba(255,255,255,.4);--purple:#7a5cff;--blue:#3E9EFF;--live:#34d399;--gold:#d4a574;--amber:#fbbf24;--red:#ef4444;--green:#25D366}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px;padding-bottom:80px}
.mono{font-family:'JetBrains Mono',monospace}
.back{position:fixed;top:20px;left:20px;color:var(--dim);text-decoration:none;font-size:13px;font-weight:600;padding:8px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.1);transition:.2s;z-index:200}
.back:hover{color:#fff;border-color:rgba(255,255,255,.3)}
h1{font-size:24px;font-weight:800;letter-spacing:-.03em;margin-bottom:6px;text-align:center}
.sub{font-size:12px;color:var(--dim);margin-bottom:20px;text-align:center}
.phone-frame{width:340px;height:680px;border-radius:44px;border:2px solid rgba(255,255,255,.1);background:linear-gradient(180deg,#0a0a0b,#050507);position:relative;overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.8)}
.phone-frame::before{content:'';position:absolute;top:14px;left:50%;transform:translateX(-50%);width:110px;height:26px;background:#000;border-radius:20px;z-index:10}
.phone-screen{position:absolute;top:38px;left:8px;right:8px;bottom:8px;border-radius:36px;background:linear-gradient(180deg,#0e0e10,#050507);overflow:hidden;display:flex;flex-direction:column}
.status-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;font-size:11px;color:var(--dim);font-family:'JetBrains Mono',monospace}
.status-bar .signal{display:flex;gap:2px;align-items:flex-end}
.status-bar .signal span{width:3px;background:var(--live);border-radius:1px}
.status-bar .signal span:nth-child(1){height:4px}
.status-bar .signal span:nth-child(2){height:6px}
.status-bar .signal span:nth-child(3){height:8px}
.status-bar .signal span:nth-child(4){height:10px}
.status-bar .battery{width:24px;height:11px;border:1px solid var(--dim);border-radius:3px;position:relative}
.status-bar .battery::after{content:'';position:absolute;right:-3px;top:2px;width:2px;height:7px;background:var(--dim);border-radius:0 2px 2px 0}
.status-bar .battery::before{content:'';position:absolute;left:1px;top:1px;bottom:1px;width:75%;background:var(--live);border-radius:1px}
.app-header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.app-header .title{font-size:15px;font-weight:700}
.app-header .icons{display:flex;gap:12px;font-size:16px}
.sim-status{display:flex;align-items:center;gap:8px;padding:10px 14px;margin:10px 12px;border-radius:12px;border:1px solid rgba(52,211,153,.2);background:rgba(52,211,153,.05)}
.sim-status .dot{width:8px;height:8px;border-radius:50%;background:var(--live);animation:pulse 1.5s infinite}
.sim-status .text{font-size:11px;color:var(--live);font-weight:600}
.sim-status .num{font-size:10px;color:var(--dim);font-family:'JetBrains Mono',monospace;margin-left:auto}
@keyframes pulse{50%{opacity:.4}}
.chat-list{flex:1;overflow-y:auto;padding:8px}
.chat-item{display:flex;gap:10px;padding:10px 12px;border-radius:12px;cursor:pointer;transition:.2s;margin-bottom:4px}
.chat-item:hover{background:rgba(255,255,255,.04)}
.chat-item.active{background:rgba(62,158,255,.1);border:1px solid rgba(62,158,255,.2)}
.chat-item .avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--blue));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
.chat-item .info{flex:1;min-width:0}
.chat-item .name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item .preview{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.chat-item .meta{text-align:right;flex-shrink:0}
.chat-item .time{font-size:10px;color:var(--dim);font-family:'JetBrains Mono',monospace}
.chat-item .badge{display:inline-block;min-width:18px;height:18px;line-height:18px;text-align:center;background:var(--blue);color:#fff;font-size:10px;font-weight:800;border-radius:9px;padding:0 5px;margin-top:4px}
.empty-chat{text-align:center;color:var(--dim);font-size:12px;padding:40px 20px;line-height:1.6}
.nav-bar{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-around;align-items:center;padding:10px 0;background:rgba(5,5,7,.95);backdrop-filter:blur(20px);border-top:1px solid var(--line)}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--dim);font-size:9px;font-weight:600;flex:1}
.nav-item:hover{color:#fff}
.nav-item.active{color:var(--blue)}
.nav-icon{font-size:18px}
.nav-label{font-size:8px;letter-spacing:.04em}

/* New Contact modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:200}
.modal-content{background:linear-gradient(180deg,#1a1a2e,#12121e);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:22px;width:90%;max-width:320px}
.modal-content h3{font-size:16px;font-weight:700;margin-bottom:14px;text-align:center;color:#fff}
.modal-content input{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:12px;color:#fff;padding:12px 14px;font-family:inherit;font-size:14px;outline:none;margin-bottom:10px}
.modal-content input:focus{border-color:rgba(62,158,255,.4)}
.modal-content input::placeholder{color:rgba(255,255,255,.3)}
.modal-btn{display:inline-flex;align-items:center;justify-content:center;border:none;border-radius:12px;padding:10px 20px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.2s;margin-top:4px}
.modal-btn.secondary{background:transparent;color:rgba(255,255,255,.5);font-size:12px;padding:8px 16px;border-radius:10px}
.modal-btn.secondary:hover{color:#fff}
.modal-btn.primary{background:linear-gradient(135deg,#3E9EFF,#7a5cff);color:#000;font-weight:700}
.modal-btn.primary:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(62,158,255,.3)}
.modal-btn:disabled{opacity:.5;cursor:not-allowed}
#phoneError{color:#ef4444;font-size:11px;margin-top:6px;display:none}
</style>
</head>
<body>
<a href="index.html" class="back">← Back</a>
<h1>Chat</h1>
<p class="sub">Real messages — connected to live API</p>

<div class="phone-frame">
  <div class="phone-screen">
    <div class="status-bar">
      <span>9:41</span>
      <div class="signal"><span></span><span></span><span></span><span></span></div>
      <div class="battery"></div>
    </div>
    <div class="app-header">
            <span class="title">Messages</span>
      <div class="icons"><span onclick="openNewContactModal()" style="cursor:pointer;padding:4px 8px;border-radius:8px;border:1px solid rgba(255,255,255,.12);transition:.2s" title="Add contact">➕</span><span>🔍</span><span>✏️</span></div>
    </div>
    <div class="sim-status">
      <div class="dot"></div>
      <span class="text">eSIM ACTIVE</span>
      <span class="num">+971 56 313 6305</span>
    </div>
        <div class="chat-list" id="chatList">
      <div class="empty-chat" id="emptyChat">
        <div style="font-size:32px;margin-bottom:12px">💬</div>
        <div>No conversations yet</div>
        <div style="margin-top:8px;font-size:11px">Messages will appear here when they arrive</div>
        <button onclick="openNewContactModal()" style="margin-top:16px;padding:10px 24px;border-radius:14px;border:1px solid rgba(62,158,255,.3);background:rgba(62,158,255,.12);color:#3E9EFF;font-size:13px;font-weight:600;cursor:pointer">➕ Add Contact</button>
      </div>
    </div>
    <div class="nav-bar">
      <a href="#" class="nav-item active"><span class="nav-icon">💬</span><span class="nav-label">Chats</span></a>
      <a href="#" class="nav-item"><span class="nav-icon">📞</span><span class="nav-label">Calls</span></a>
      <a href="#" class="nav-item"><span class="nav-icon">◫</span><span class="nav-label">Wallet</span></a>
      <a href="#" class="nav-item"><span class="nav-icon">◍</span><span class="nav-label">Me</span></a>
    </div>
  </div>
</div>

<div class="modal-overlay" id="contactModal" style="display:none">
  <div class="modal-content">
    <h3>Add WhatsApp contact</h3>
    <input id="contactName" placeholder="Name" autocomplete="name">
    <input id="contactPhone" placeholder="Phone with country code" inputmode="tel" autocomplete="tel">
    <div id="phoneError"></div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:8px">
      <button class="modal-btn secondary" onclick="closeNewContactModal()">Cancel</button>
      <button class="modal-btn primary" id="saveContact" onclick="saveContact()">Save</button>
    </div>
  </div>
</div>

<script>
function openNewContactModal() {
  document.getElementById('contactModal').style.display = 'flex';
  document.getElementById('contactName').focus();
}

function closeNewContactModal() {
  document.getElementById('contactModal').style.display = 'none';
  document.getElementById('phoneError').style.display = 'none';
}

async function saveContact() {
  const name = document.getElementById('contactName').value.trim();
  const phone = document.getElementById('contactPhone').value.trim();
  const error = document.getElementById('phoneError');
  const button = document.getElementById('saveContact');
  button.disabled = true;
  try {
    const res = await fetch('/api/contacts', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({name, phone}) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Could not save contact');
    closeNewContactModal();
    document.getElementById('contactName').value = '';
    document.getElementById('contactPhone').value = '';
    loadChats();
  } catch (err) {
    error.textContent = err.message;
    error.style.display = 'block';
  } finally {
    button.disabled = false;
  }
}

// Load real conversations from API
async function loadChats() {
  try {
    const res = await fetch('/api/inbox');
    const data = await res.json();
    const list = document.getElementById('chatList');
    if (!data.conversations || data.conversations.length === 0) {
      list.innerHTML = '<div class="empty-chat"><div style="font-size:32px;margin-bottom:12px">💬</div><div>No conversations yet</div><div style="margin-top:8px;font-size:11px">Messages will appear here when they arrive</div></div>';
      return;
    }
    list.innerHTML = data.conversations.map(c => `
      <div class="chat-item" onclick="openChat(${c.id})">
        <div class="avatar">${(c.name || 'U')[0].toUpperCase()}</div>
        <div class="info">
          <div class="name">${c.name || 'Unknown'}</div>
          <div class="preview">${c.last_message || 'No messages'}</div>
        </div>
        <div class="meta">
          <div class="time">${c.last_message_at ? new Date(c.last_message_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : ''}</div>
          ${c.unread > 0 ? `<div class="badge">${c.unread}</div>` : ''}
        </div>
      </div>
    `).join('');
  } catch (e) {
    console.log('API not available:', e.message);
  }
}

function openChat(id) {
  window.location.href = '/dashboard/';
}

// Live connection loop — checks API every 3s
async function checkConnection() {
  try {
    const res = await fetch('/api/health');
    const data = await res.json();
    const statusEl = document.querySelector('.sim-status .text');
    const dotEl = document.querySelector('.sim-status .dot');
    if (data.status === 'ok') {
      statusEl.textContent = 'eSIM ACTIVE — CONNECTED';
      dotEl.style.background = 'var(--live)';
      dotEl.style.boxShadow = '0 0 8px var(--live)';
    } else {
      statusEl.textContent = 'eSIM ACTIVE — RECONNECTING';
      dotEl.style.background = 'var(--amber)';
    }
  } catch (e) {
    const statusEl = document.querySelector('.sim-status .text');
    const dotEl = document.querySelector('.sim-status .dot');
    statusEl.textContent = 'eSIM ACTIVE — OFFLINE';
    dotEl.style.background = 'var(--red)';
  }
}

// Load on start
loadChats();
checkConnection();
// Refresh every 3 seconds
setInterval(() => { loadChats(); checkConnection(); }, 3000);
</script>
</body>
</html>
